# Frontend IRONIX: SPA + reverse proxy tới backend FastAPI (dịch vụ "backend" trong docker compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # File nhập sản phẩm tối đa 2MB, ảnh đại diện gửi dạng base64 trong JSON.
    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/(api|health)/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    # Tài liệu API (Swagger) dùng chung cổng với giao diện.
    location ~ ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # File build của Vite có hash trong tên: cache lâu dài.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Mọi đường dẫn khác là route của React (/admin, /reset-password...).
    location / {
        try_files $uri /index.html;
    }
}
