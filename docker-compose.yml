# Môi trường đầy đủ để chạy và demo: MySQL, Redis, API, worker, giao diện, hộp thư Mailpit.
#   cp .env.example .env      # rồi đặt JWT_SECRET_KEY và ADMIN_DEFAULT_PASSWORD
#   docker compose up --build
# Giao diện:  http://localhost:8080      Swagger: http://localhost:8080/docs
# Hộp thư:    http://localhost:8025      (mọi email hệ thống gửi đều hiện ở đây)

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: ${MYSQL_USER:-gymfitness_app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
  MYSQL_DATABASE: ${MYSQL_DATABASE:-gymfitness}
  REDIS_URL: redis://redis:6379/0
  FRONTEND_ORIGINS: '${FRONTEND_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}'
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  # Bắt buộc đặt trong .env gốc; backend từ chối secret yếu khi APP_ENV khác development.
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  PAYMENT_BANK_CODE: ${PAYMENT_BANK_CODE:-}
  PAYMENT_ACCOUNT_NO: ${PAYMENT_ACCOUNT_NO:-}
  PAYMENT_ACCOUNT_NAME: ${PAYMENT_ACCOUNT_NAME:-}
  PAYMENT_CODE_PREFIX: ${PAYMENT_CODE_PREFIX:-IRX}
  SEPAY_WEBHOOK_API_KEY: ${SEPAY_WEBHOOK_API_KEY:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@gmail.com}
  ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-}
  # Email: mặc định gửi vào Mailpit; đổi sang SMTP thật (Gmail, SES...) khi triển khai.
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  MAIL_FROM: ${MAIL_FROM:-IRONIX Fitness <no-reply@ironix.vn>}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gymfitness}
      MYSQL_USER: ${MYSQL_USER:-gymfitness_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_me}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/01_tables.sql:/docker-entrypoint-initdb.d/01_tables.sql:ro
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./database/03_procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./database/04_seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
      - ./database/05_procedures_pt.sql:/docker-entrypoint-initdb.d/05_procedures_pt.sql:ro
      - ./database/06_procedures_payment.sql:/docker-entrypoint-initdb.d/06_procedures_payment.sql:ro
      - ./database/07_pt_schedule.sql:/docker-entrypoint-initdb.d/07_pt_schedule.sql:ro
      - ./database/08_admin.sql:/docker-entrypoint-initdb.d/08_admin.sql:ro
      - ./database/09_admin_shop.sql:/docker-entrypoint-initdb.d/09_admin_shop.sql:ro
      # Dữ liệu mẫu cho demo; bỏ dòng này khi triển khai thật.
      - ./database/10_seed_demo.sql:/docker-entrypoint-initdb.d/10_seed_demo.sql:ro
      - ./database/11_platform.sql:/docker-entrypoint-initdb.d/11_platform.sql:ro
      - ./database/12_lifecycle.sql:/docker-entrypoint-initdb.d/12_lifecycle.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      # Worker chạy bảo trì định kỳ (hết hạn gói, nhắc gia hạn, đóng buổi PT quá hạn).
      MAINTENANCE_IN_API: "false"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Tiến trình chạy tác vụ nền: gửi email, xuất báo cáo Excel/CSV/PDF.
  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.tasks.worker"]
    environment: *backend-env
    volumes:
      # Cùng thư mục với backend để file xuất xong tải được qua API.
      - app_storage:/app/storage
    healthcheck:
      disable: true
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./client
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

  # Hộp thư giả lập SMTP cho môi trường dev/demo: xem email tại http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  mysql_data:
  app_storage:
