name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, coverage)
    runs-on: ubuntu-latest

    # Bộ test gọi API thật trên MySQL thật vì mọi truy vấn nằm trong stored procedure.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: gymfitness
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: development
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_root_password
      MYSQL_DATABASE: gymfitness

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # Thứ tự theo tiền tố số của tên file: 01_tables … 12_lifecycle.
      - name: Create schema, procedures and seed data
        run: python scripts/apply_sql.py database/[0-9][0-9]_*.sql

      - name: Test with coverage
        working-directory: backend
        run: python -m pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run build

  docker:
    name: Docker images (build)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          IMAGE_PREFIX=ghcr.io/example/gymfitness docker compose -f docker-compose.prod.yml config --quiet

      - name: Build backend image
        run: docker build --tag gymfitness-backend:ci backend

      - name: Build frontend image
        run: docker build --tag gymfitness-frontend:ci client

  # CD: mỗi lần main xanh, đẩy image lên GitHub Container Registry; nếu đã khai báo
  # secrets DEPLOY_HOST/DEPLOY_USER/DEPLOY_SSH_KEY thì cập nhật luôn máy chủ qua SSH.
  deploy:
    name: Deploy (push images, update server)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push images
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for part in backend frontend; do
            context=$([ "$part" = backend ] && echo backend || echo client)
            docker build --tag "$prefix-$part:${GITHUB_SHA::7}" --tag "$prefix-$part:latest" "$context"
            docker push --all-tags "$prefix-$part"
          done
          echo "IMAGE_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Update server over SSH
        if: env.DEPLOY_HOST != ''
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/gymfitness' }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$DEPLOY_SSH_KEY" > ~/deploy_key
          ssh -i ~/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && export IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='${GITHUB_SHA::7}' \
             && docker compose -f docker-compose.prod.yml pull \
             && docker compose -f docker-compose.prod.yml up -d --remove-orphans"
